# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: false
    base_branches: [main]
  path_filters:
    - "!.agents/**"
    - "!agent/**"
    - "!.claude/**"
    - "!package-lock.json"
    - "!design/**"
  path_instructions:
    - path: "**/*.{ts,tsx}"
      instructions: >-
        Next.js 16 App Router; APIs may differ from older versions. Sanity read/write
        tokens, Clerk secret key and private PostHog keys must stay server-only. The
        browser never writes content or progress directly; writes go through server routes.
